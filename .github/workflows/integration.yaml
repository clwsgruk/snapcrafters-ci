name: Protected integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapcrafters-ci-protected-integration
  cancel-in-progress: false

jobs:
  verify:
    environment: snapcrafters-ci-integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: false
          cache: false
      - name: Install pinned tools and dependencies
        run: |
          mise install
          mise run install
      - name: Run protected non-publishing integration checks
        run: mise run ci
