name: Fetch manifests
description: Downloads and unzips all build manifest artifacts for the current workflow run.
author: Snapcrafters
branding:
  icon: code
  color: orange

inputs:
  token:
    description: "A token with permissions to get artifacts from this repository"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: "24"
    - shell: bash
      env:
        CI_PHASE: validate
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
    - shell: bash
      env:
        CI_PHASE: run
        INPUT_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
