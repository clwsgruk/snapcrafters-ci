name: Release to Candidate
description: Builds a snap using `snapcraft remote-build` and releases it to candidate
author: Snapcrafters
branding:
  icon: tag
  color: orange

inputs:
  architecture:
    description: "The architecture to build the snap for"
    default: amd64
    required: false
  bot-email:
    description: "The email address of the bot account used to commit screenshots."
    required: false
    default: "snapforge.team@gmail.com"
  bot-name:
    description: "The name of the bot account used to commit screenshots."
    required: false
    default: "Snapcrafters Bot"
  channel:
    description: "The channel to publish the snap to"
    default: "latest/candidate"
    required: false
  launchpad-token:
    description: "A token with permissions to create remote builds on Launchpad"
    required: true
  multi-snap:
    description: "Whether the repo contains the source for multiple snaps"
    required: false
    default: "false"
  repo-token:
    required: true
    description: A token with privileges to create and push tags to the repository.
  snapcraft-project-root:
    description: "The root of the snapcraft project, where the `snapcraft` command would usually be executed from."
    required: false
  snapcraft-channel:
    description: "The channel to install snapcraft from"
    default: latest/stable
    required: false
  store-token:
    description: "A token with permissions to upload to the specified channel"
    required: true

outputs:
  revision:
    description: "The revision of the uploaded snap"
    value: ${{ steps.publish.outputs.revision }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: "24"
    - shell: bash
      env:
        CI_PHASE: validate
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        token: ${{ inputs.repo-token }}
        fetch-depth: 0
    - shell: bash
      env:
        CI_PHASE: prepare
        INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        INPUT_SNAPCRAFT_PROJECT_ROOT: ${{ inputs.snapcraft-project-root }}
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
      id: prepare
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      if: github.run_attempt != '1'
      with:
        name: ${{ steps.prepare.outputs.state-name }}
        github-token: ${{ inputs.repo-token }}
        run-id: ${{ github.run_id }}
    - shell: bash
      env:
        SNAPCRAFT_CHANNEL: ${{ inputs.snapcraft-channel }}
      run: 'sudo snap install snapcraft --channel "$SNAPCRAFT_CHANNEL" --classic

        if ! snap list review-tools >/dev/null 2>&1; then sudo snap install review-tools; fi'
    - shell: bash
      env:
        CI_PHASE: run
        INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_LAUNCHPAD_TOKEN: ${{ inputs.launchpad-token }}
        INPUT_SNAPCRAFT_PROJECT_ROOT: ${{ inputs.snapcraft-project-root }}
        INPUT_SNAPCRAFT_CHANNEL: ${{ inputs.snapcraft-channel }}
        INPUT_STORE_TOKEN: ${{ inputs.store-token }}
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
      id: publish
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ steps.prepare.outputs.state-name }}
        path: ${{ steps.prepare.outputs.state-path }}
        include-hidden-files: "true"
        overwrite: "true"
        if-no-files-found: error
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: manifest-${{ inputs.architecture }}
        path: manifest-${{ inputs.architecture }}.yaml
        overwrite: "true"
        if-no-files-found: error
    - shell: bash
      env:
        CI_PHASE: tag
        INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        INPUT_BOT_EMAIL: ${{ inputs.bot-email }}
        INPUT_BOT_NAME: ${{ inputs.bot-name }}
        INPUT_MULTI_SNAP: ${{ inputs.multi-snap }}
        INPUT_REPO_TOKEN: ${{ inputs.repo-token }}
        INPUT_SNAPCRAFT_PROJECT_ROOT: ${{ inputs.snapcraft-project-root }}
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
    - shell: bash
      env:
        CI_PHASE: report
        INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        INPUT_SNAPCRAFT_PROJECT_ROOT: ${{ inputs.snapcraft-project-root }}
      run: node "$GITHUB_ACTION_PATH/dist/index.cjs"
      if: failure() && steps.publish.outcome == 'success'
