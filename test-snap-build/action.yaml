name: Test Snap Build
description: Build the snap locally using Snapcraft and review the output.
author: Snapcrafters
branding:
  icon: zap
  color: orange

inputs:
  install:
    description: "Option to install the snap on the runner after build"
    default: "false"
    required: false
  snapcraft-channel:
    description: "The channel to install snapcraft from"
    default: latest/stable
    required: false
  snapcraft-project-root:
    description: "The root of the snapcraft project, where the `snapcraft` command would usually be executed from."
    required: false

runs:
  using: composite
  steps:
    - name: Checkout the source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Build snap
      uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
      id: build
      with:
        path: ${{ inputs.snapcraft-project-root }}
        snapcraft-channel: ${{ inputs.snapcraft-channel }}
    - name: Setup Node 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24.20.0"
    - name: Run test-snap-build
      shell: bash
      env:
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_SNAPCRAFT_CHANNEL: ${{ inputs.snapcraft-channel }}
        INPUT_SNAPCRAFT_PROJECT_ROOT: ${{ inputs.snapcraft-project-root }}
        INPUT_SNAP: ${{ steps.build.outputs.snap }}
      run: node "${{ github.action_path }}/dist/index.cjs"
