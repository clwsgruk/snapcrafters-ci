name: Setup ghvmctl
description: Configure a runner for access to the KVM socket and install ghvmctl
author: snapcrafters
branding:
  icon: refresh-cw
  color: orange

runs:
  using: composite
  steps:
    - name: Enable KVM on the GitHub Actions runner
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Setup LXD
      uses: canonical/setup-lxd@4e959f8e0d9c5feb27d44c5e4d9a330a782edee0 # v0.1.1
    - name: Setup Node 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24.20.0"
    - name: Run setup-ghvmctl
      shell: bash
      env:
      run: node "${{ github.action_path }}/dist/index.cjs"
