[tools]
node = "24.20.0"
bun = "1.4.0"
vp = "0.3.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
prek = "0.5.2"
[tasks.install]
run = "bun install --frozen-lockfile"
[tasks.fmt]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" node_modules/vite-plus/bin/vp fmt'
[tasks.check]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" node_modules/vite-plus/bin/vp check'
[tasks.test]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" node_modules/vite-plus/bin/vp test run'
[tasks.size]
run = '"{{ tools.node.path }}/bin/node" scripts/size.ts'
[tasks.build]
run = "bun scripts/build.ts"
[tasks."test:coverage"]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" node_modules/vite-plus/bin/vp test run --coverage'
[tasks."test:smoke"]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" node_modules/vite-plus/bin/vp test run src/smoke.test.ts'
[tasks."test:contract"]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" node_modules/vite-plus/bin/vp test run src/contracts.test.ts src/wrappers.test.ts'
[tasks.actionlint]
run = "actionlint"
[tasks.shellcheck]
run = '"{{ tools.node.path }}/bin/node" scripts/shellcheck.ts'
[tasks."check-dist"]
run = 'PATH="{{ tools.node.path }}/bin:$PATH" "{{ tools.node.path }}/bin/node" scripts/check-dist.ts'
[tasks."hooks:install"]
run = "prek install"
[tasks."hooks:run"]
run = "prek run --all-files"
[tasks.ci]
run = [
  '"{{ mise_bin }}" run check',
  '"{{ mise_bin }}" run test:coverage',
  '"{{ mise_bin }}" run actionlint',
  '"{{ mise_bin }}" run shellcheck',
  '"{{ mise_bin }}" run size',
  '"{{ mise_bin }}" run build',
  '"{{ mise_bin }}" run check-dist',
]
