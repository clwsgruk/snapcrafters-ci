name: Review Snap
description: Review a built Snap package using the same tools as the Snap Store
author: Snapcrafters
branding:
  icon: check-circle
  color: orange

inputs:
  is-classic:
    description: "Set this to 'true' if you are reviewing a classic snap"
    required: false
  plugs:
    description: "The file holding plugs declarations as json to override default snap permissions"
    required: false
  slots:
    description: "The file holding slots declarations as json to override default snap permissions"
    required: false
  snap:
    description: "The snap file to review"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24.20.0"
    - name: Run review-snap
      shell: bash
      env:
        INPUT_IS_CLASSIC: ${{ inputs.is-classic }}
        INPUT_PLUGS: ${{ inputs.plugs }}
        INPUT_SLOTS: ${{ inputs.slots }}
        INPUT_SNAP: ${{ inputs.snap }}
      run: node "${{ github.action_path }}/dist/index.cjs"
